[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlock"
version = "0.1.0"
description = "An open-source security sandbox for AI agents."
requires-python = ">=3.13"

default: deny

rules:
  read_file: allow
  write_file: deny
  network_access: ask


[tool.setuptools.packages.find]
include = ["agentlock*"]

[project.scripts]
agentlock = "agentlock.cli:app"
