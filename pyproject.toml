[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlock"
version = "0.1.0"
description = "An open-source security sandbox for AI agents."
requires-python = ">=3.13"
dependencies = [
    "typer>=0.27,<1.0",
    "pyyaml>=6.0,<7.0"
]

[tool.setuptools.packages.find]
include = ["agentlock*"]

[project.scripts]
agentlock = "agentlock.cli:app"